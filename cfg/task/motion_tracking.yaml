# @package task
name: motion_tracking

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]

robot: 
  name: g1_waist_unlocked
terrain: plane

# common
num_envs: 1
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

input:
  action:
    _target_: JointPosition
    action_scaling: 
      .*hip_pitch.*: 0.548
      .*hip_roll.*: 0.351
      .*hip_yaw.*: 0.548
      .*knee.*: 0.351
      waist_yaw_joint: 0.4386
      waist_roll_joint: 0.439
      waist_pitch_joint: 0.439
      .*ankle.*: 0.439
      .*shoulder.*: 0.4386
      .*elbow_joint: 0.4386
      # .*wrist_roll.*: 0.173
      # .*wrist_pitch.*: 0.293
      # .*wrist_yaw.*: 0.293
    max_delay: 2
    alpha_range: [0.8, 1.0]

command:
  _target_: motion_tracking.MotionTrackingCommand
  data_path: walk
  motion_id: null
  future_steps: [0]
  anchor_body_name: torso_link
  random_start: true
  adaptive_sampling: true

observation:
  policy:
    command: {}
    motion_anchor_pos_b: {noise_amplitude: 0.25}
    motion_anchor_ori_b: {noise_amplitude: 0.05}
    root_lin_vel_b: {noise_amplitude: 0.5}
    root_ang_vel_b: {noise_amplitude: 0.2}
    joint_pos_bm: {noise_amplitude: 0.01}
    joint_vel_bm: {noise_amplitude: 0.5}
    last_action_bm: {}
  priv:
    command: {}
    motion_anchor_pos_b: {}
    motion_anchor_ori_b: {}
    root_lin_vel_b: {}
    root_ang_vel_b: {}
    joint_pos_bm: {}
    joint_vel_bm: {}
    last_action_bm: {}
    body_pose_b:
      body_names:
      - "pelvis"
      - "left_hip_roll_link"
      - "left_knee_link"
      - "left_ankle_roll_link"
      - "right_hip_roll_link"
      - "right_knee_link"
      - "right_ankle_roll_link"
      - "torso_link"
      - "left_shoulder_roll_link"
      - "left_elbow_link"
      - "left_wrist_yaw_link"
      - "right_shoulder_roll_link"
      - "right_elbow_link"
      - "right_wrist_yaw_link"
      anchor_body_name: "torso_link"

reward:
  tracking:
    body_pos_tracking:
      weight: 1.0
      body_names: &tracking_keypoints
      - "pelvis"
      - "left_hip_roll_link"
      - "left_knee_link"
      - "left_ankle_roll_link"
      - "right_hip_roll_link"
      - "right_knee_link"
      - "right_ankle_roll_link"
      - "torso_link"
      - "left_shoulder_roll_link"
      - "left_elbow_link"
      - "left_wrist_yaw_link"
      - "right_shoulder_roll_link"
      - "right_elbow_link"
      - "right_wrist_yaw_link"
    body_rotmat_tracking:
      weight: 1.0
      body_names: *tracking_keypoints
    body_lin_vel_tracking:
      weight: 1.0
      body_names: *tracking_keypoints
    body_ang_vel_tracking:
      weight: 1.0
      body_names: *tracking_keypoints
    root_pos_tracking:
      weight: 0.5
    root_quat_tracking:
      weight: 0.5

  regularization:
    action_rate_l2:      {weight: 0.1}
    joint_limits:        {weight: 10.0, joint_names: ".*", offset: 0.0}
    undesired_self_contacts:
      weight: 0.1
      threshold: 1.0
      body_names:
      - "pelvis"
      - "waist_.*_link"
      - "torso_link"
      - ".*_hip_.*_link"
      - ".*_knee_link"
      - ".*_shoulder_.*_link"
      - ".*_elbow_link"

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.6, 2.0]
    dynamic_friction_range: [0.6, 2.0]
    restitution_range: [0.0, 0.2]
  actuator_pd_gains:
    stiffness_range:
      .*: [0.8, 1.1]
    damping_range:
      .*: [0.8, 1.1]
  push_body:
    body_names: "torso_link"
    force_range: [20, 100]
    min_interval: 100
    decay: 0.9

termination:
  max_episode_length: {}
  motion_finished: {}
  # body_pos_z_error:
  #   threshold: 0.25
  #   body_names:
  #   - "pelvis"
  #   - ".*_ankle_roll_link"
  #   - ".*_wrist_yaw_link"
  anchor_ori_error:
    threshold: 0.8
  crash: 
    body_names_expr:
    - "pelvis"
    - "torso_link"
    - ".*_hip_.*_link"
    - ".*shoulder_.*_link"
    - ".*(wrist|elbow).*"
  fall_over: {xy_thres: 0.9}
